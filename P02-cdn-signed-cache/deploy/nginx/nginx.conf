# Configuração principal do Nginx da CDN.
#
# Ela é mínima de propósito: tudo que descreve a CDN está em conf.d/cdn.conf,
# gerado a partir de deploy/nginx/templates/cdn.conf.template pelo entrypoint da
# imagem oficial, que substitui as variáveis de ambiente CDN_*.
#
# O include aqui aponta para UM arquivo, não para conf.d/*.conf. A imagem oficial
# traz um default.conf que publica um servidor na porta 80, e um include genérico
# o carregaria junto sem ninguém perceber.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;

    # server_tokens off remove a versão do Nginx das respostas e das páginas de
    # erro. Não impede nada sozinho, mas evita entregar de graça a versão exata
    # para quem procura uma falha conhecida.
    server_tokens off;

    include /etc/nginx/conf.d/cdn.conf;
}
