# Tempo mínimo: recebe OTLP e guarda em disco efêmero.
#
# Como o Loki daqui do lado, ele existe para uma janela curta: achar a requisição
# lenta de dois minutos atrás e ver onde ela gastou o tempo.

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  # Fechar o bloco rápido é o que faz o trace aparecer na busca em segundos em
  # vez de minutos. Num ambiente real isso custaria muitos arquivos pequenos.
  max_block_duration: 30s

compactor:
  compaction:
    block_retention: 2h

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal
