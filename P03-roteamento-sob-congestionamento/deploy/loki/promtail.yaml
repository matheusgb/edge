# Promtail lendo os logs dos containers do lab e mandando para o Loki.
#
# A descoberta é pelo próprio Docker: em vez de listar containers à mão, o
# promtail pergunta ao daemon quais existem e acompanha os que aparecem. É o que
# faz o log de um container recriado no meio do experimento continuar chegando.
#
# Os serviços Go escrevem JSON com slog. O pipeline abaixo extrai os campos que
# interessam para virar rótulo, e só esses: rótulo no Loki tem o mesmo problema de
# cardinalidade que rótulo no Prometheus, e o identificador de correlação, que é
# único por requisição, fica no CORPO da linha, onde a busca por texto o encontra
# sem criar um fluxo novo para cada requisição.

server:
  http_listen_port: 9080
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: service
    pipeline_stages:
      - json:
          expressions:
            level: level
            msg: msg
            service: service
      - labels:
          level:
