name: integration

# Testes com a tag `integration` de P01, P02 e P03. Sobem contêineres de verdade
# (testcontainers e docker compose), por isso ficam fora do workflow `ci`: são
# mais lentos e dependem do Docker do runner. Rodam só quando algo desses três
# projetos muda, ou sob demanda (workflow_dispatch).
on:
  push:
    branches: [master]
    paths:
      - "P01-hot-path-http/**"
      - "P02-cdn-signed-cache/**"
      - "P03-roteamento-sob-congestionamento/**"
      - ".github/workflows/integration.yaml"
  pull_request:
    branches: [master]
    paths:
      - "P01-hot-path-http/**"
      - "P02-cdn-signed-cache/**"
      - "P03-roteamento-sob-congestionamento/**"
      - ".github/workflows/integration.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: ${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        module:
          - P01-hot-path-http
          - P02-cdn-signed-cache
          - P03-roteamento-sob-congestionamento
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Imagem de origem do P01
        if: matrix.module == 'P01-hot-path-http'
        run: docker build -t p01-origin .

      - name: Segredos efêmeros do P02
        if: matrix.module == 'P02-cdn-signed-cache'
        run: |
          {
            echo "CDN_ORIGIN_SECRET=$(openssl rand -hex 32)"
            echo "CDN_SIGNING_KEYS=k1:$(openssl rand -hex 32),k2:$(openssl rand -hex 32)"
            echo "CDN_ACTIVE_KEY=k2"
            echo "CDN_CACHE_TTL=60s"
          } > .env

      - name: go test -tags=integration
        run: go test -count=1 -timeout 15m -tags=integration -v ./test/...
